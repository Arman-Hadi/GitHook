<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Repositories</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <div class="container-sm mt-5 mb-3">
        <div class="row justify-content-start align-items-start g-2 mx-5">
            <a class="fs-3 text-decoration-none mb-3" data-bs-toggle="collapse" href="#collapseNewRepo" role="button" aria-expanded="false" aria-controls="collapseNewRepo">
                New Repository
            </a>
        </div>
        <form id="collapseNewRepo" class="collapse mb-4">
            <div class="row justify-content-start align-items-start g-2 mx-5">
                <div class="col">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingName" placeholder="name">
                        <label for="floatingInput">Name</label>
                    </div>
                </div>
                <div class="col">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="floatingRepository" placeholder="repository">
                        <label for="floatingRepository">Repository</label>
                    </div>
                </div>
                <div class="col">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="floatingBranch" placeholder="local branch">
                        <label for="floatingBranch">Local Branch</label>
                    </div>
                </div>
            </div>

            <div class="row justify-content-start align-items-start g-2 mx-5">
                <div class="col">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingPath" placeholder="path">
                        <label for="floatingPath">Path</label>
                    </div>
                </div>
            </div>

            <div class="row justify-content-start align-items-start g-2 mx-5">
                <div class="col">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingServices" placeholder="services">
                        <label for="floatingServices">Docker Services (seperate with space)</label>
                    </div>
                </div>
            </div>

            <div class="row justify-content-start align-items-start g-2 mx-5">
                <div class="col p-3">
                    <input class="form-check-input" type="checkbox" id="floatingAlwaysRestart">
                    <label class="form-check-label" for="floatingAlwaysRestart">Always Restart</label>
                </div>
                <div class="col-10">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingRestartFiles" placeholder="restart files">
                        <label for="floatingRestartFiles">Restart Files (seperate with space)</label>
                    </div>
                </div>
            </div>

            <div class="row justify-content-start align-items-start g-2 mx-5">
                <div class="col p-3">
                    <input class="form-check-input" type="checkbox" id="floatingAlwaysBuild">
                    <label class="form-check-label" for="floatingAlwaysBuild">Always Build</label>
                </div>
                <div class="col-10">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingBuildFiles" placeholder="build files">
                        <label for="floatingBuildFiles">Build Files (seperate with space)</label>
                    </div>
                </div>
            </div>

            <div class="row justify-content-start align-items-start g-2 mx-5">
                <div class="col">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingToken" placeholder="token">
                        <label for="floatingPath">Token</label>
                    </div>
                </div>
            </div>

            <div class="row justify-content-start align-items-start g-2 mx-5">
                <button type="submit" class="btn btn-primary py-2 mr-2">Submit</button>
            </div>
        </form>
    </div>

    <hr>
</html>
